[package]
name = "klipperx"
version = "0.1.0"
edition = "2021"
default-run = "klipperx"
description = "KlipperX CLI - Klipper API Server"
license = "GPL-3.0"

[[bin]]
name = "klipperx"
path = "src/main.rs"

[[bin]]
name = "klippy"
path = "src/bin/klippy/main.rs"

[[bin]]
name = "klippy-client"
path = "src/bin/klippy-client/main.rs"

[lib]
name = "klipperx"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
libc = "0.2"
libloading = "0.8"
crossbeam-channel = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
hex = "0.4"

[features]
default = []

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
klipperx-test-support = { path = "crates/test-support" }
