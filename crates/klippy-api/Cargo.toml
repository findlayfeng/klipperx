[package]
name = "klippy-api"
version = "0.1.0"
edition = "2021"
description = "Klipper API: the 0x03-framed JSON protocol, its socket, and the server that serves it"
license = "GPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
