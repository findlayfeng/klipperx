[package]
name = "klippy-client"
version = "0.1.0"
edition = "2021"
description = "Klipper API client: one request, or an interactive session"
license = "GPL-3.0"

[lib]
name = "klippy_client"
path = "src/lib.rs"

[[bin]]
name = "klippy-client"
path = "src/main.rs"

[dependencies]
klippy-api = { path = "../klippy-api" }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm"] }
serde_json = "1"
# `serde_yaml` itself was archived; this is the drop-in continuation, renamed so
# the code reads `serde_yaml` as it would have. Client-side only: the host and
# the wire speak JSON.
serde_yaml = { version = "0.10.0", package = "serde_yaml_ng" }
tokio = { version = "1", features = ["net", "io-util", "io-std", "sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
